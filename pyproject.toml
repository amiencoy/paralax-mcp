[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paralax-mcp"
version = "0.1.0"
description = "Policy-gated MCP workspace tools and Gemini desktop setup"
requires-python = ">=3.11"
dependencies = ["axionorm>=0.1,<0.2", "parabiont-protocol>=0.1,<0.2", "mcp==1.30.0"]

[project.scripts]
paralax-mcp = "paralax_mcp.server:main"
paralax-setup = "paralax_mcp.setup:main"

[tool.setuptools.packages.find]
where = ["src"]
